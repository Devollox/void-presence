name: Finalize Release from Updates

on:
  repository_dispatch:
    types: [repo_binary_updates]

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Parse payload
        id: payload
        shell: bash
        run: |
          echo "source_tag=${{ github.event.client_payload.source_tag }}" >> "$GITHUB_OUTPUT"
          echo "updates_tag=${{ github.event.client_payload.updates_tag }}" >> "$GITHUB_OUTPUT"

      - name: Validate payload
        shell: bash
        run: |
          if [ -z "${{ steps.payload.outputs.source_tag }}" ]; then
            echo "ERROR: source_tag is empty"
            exit 1
          fi
          if [ -z "${{ steps.payload.outputs.updates_tag }}" ]; then
            echo "ERROR: updates_tag is empty"
            exit 1
          fi

      - name: Download all updater binaries from void-updates release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_TAG="${{ steps.payload.outputs.source_tag }}"
          UPDATES_TAG="${{ steps.payload.outputs.updates_tag }}"
          VERSION="${SOURCE_TAG#v}"

          echo "source_tag  = $SOURCE_TAG"
          echo "updates_tag = $UPDATES_TAG"
          echo "version     = $VERSION"

          gh release download "$UPDATES_TAG" \
            --repo "Devollox/void-updates" \
            --pattern "Void.Presence.Updates.*" \
            --dir downloaded

          echo "=== downloaded files ==="
          ls -lh downloaded/

      - name: Rename updater files to Setup names
        shell: bash
        run: |
          VERSION="${{ steps.payload.outputs.source_tag }}"
          VERSION="${VERSION#v}"

          mkdir -p renamed

          for f in downloaded/*; do
            name=$(basename "$f")
            case "$name" in
              *.exe)
                dest="renamed/Void.Presence.Setup.$VERSION.exe"
                cp "$f" "$dest"
                echo "Windows: $name → $(basename "$dest")"
                ;;
              *.dmg)
                dest="renamed/Void.Presence.Setup.$VERSION.dmg"
                cp "$f" "$dest"
                echo "macOS: $name → $(basename "$dest")"
                ;;
              *.deb)
                dest="renamed/Void.Presence.Setup.$VERSION.deb"
                cp "$f" "$dest"
                echo "Linux: $name → $(basename "$dest")"
                ;;
              *)
                echo "Skipping unknown file: $name"
                ;;
            esac
          done

          echo "=== renamed files ==="
          ls -lh renamed/

      - name: Delete old non-Setup assets from void-presence release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.payload.outputs.source_tag }}"
          OWNER="Devollox"
          REPO="void-presence"

          assets_json=$(gh api "repos/$OWNER/$REPO/releases/tags/$TAG" --jq '.assets')
          echo "$assets_json" | jq -c '.[]' | while read -r asset; do
            name=$(echo "$asset" | jq -r '.name')
            id=$(echo "$asset" | jq -r '.id')
            case "$name" in
              Void.Presence.[0-9]*.dmg|Void.Presence.[0-9]*.amd64.deb|Void.Presence.[0-9]*.x86_64.rpm)
                echo "Deleting old asset: $name (id=$id)"
                gh api "repos/$OWNER/$REPO/releases/assets/$id" -X DELETE >/dev/null
                ;;
              *)
                ;;
            esac
          done

      - name: Rename portable assets in void-presence release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.payload.outputs.source_tag }}"
          OWNER="Devollox"
          REPO="void-presence"

          assets_json=$(gh api "repos/$OWNER/$REPO/releases/tags/$TAG" --jq '.assets')
          echo "$assets_json" | jq -c '.[]' | while read -r asset; do
            name=$(echo "$asset" | jq -r '.name')
            id=$(echo "$asset" | jq -r '.id')
            url=$(echo "$asset" | jq -r '.browser_download_url')

            case "$name" in
              Void.Presence.Portable.*.zip)
                newname=""
                if [[ "$name" == Void.Presence.Portable.*.arm64.zip ]]; then
                  ver="${name#Void.Presence.Portable.}"
                  ver="${ver%.arm64.zip}"
                  newname="Void.Presence.Portable.${ver}.macos.zip"
                elif [[ "$name" == Void.Presence.Portable.*.linux.zip ]]; then
                  newname="$name"
                else
                  ver="${name#Void.Presence.Portable.}"
                  ver="${ver%.zip}"
                  newname="Void.Presence.Portable.${ver}.windows.zip"
                fi

                if [ -n "$newname" ] && [ "$newname" != "$name" ]; then
                  echo "Renaming portable asset: $name → $newname"

                  tmpdir=$(mktemp -d)
                  curl -sL "$url" -o "$tmpdir/$newname"

                  gh release upload "$TAG" "$tmpdir/$newname" \
                    --repo "$OWNER/$REPO" \
                    --clobber

                  echo "Deleting old portable asset: $name (id=$id)"
                  gh api "repos/$OWNER/$REPO/releases/assets/$id" -X DELETE >/dev/null
                fi
                ;;
              *)
                ;;
            esac
          done

      - name: Upload all updater files to void-presence release
        uses: softprops/action-gh-release@v2
        with:
          files: renamed/*
          tag_name: ${{ steps.payload.outputs.source_tag }}
          overwrite_files: true
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
