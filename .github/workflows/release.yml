name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if release already exists for this tag
        id: check
        run: |
          if gh release view "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: preflight
    if: needs.preflight.outputs.exists == 'false'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            rpm \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libxcb-dri3-0

      - name: Install dependencies
        run: npm install

      - name: Install platform-specific sharp binaries
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            npm install --os=win32 --cpu=x64 sharp
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            npm install --os=darwin --cpu=x64 sharp
            npm install --os=darwin --cpu=arm64 sharp
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            npm install --os=linux --cpu=x64 sharp
          fi

      - name: Build Application (Windows)
        if: matrix.platform == 'windows'
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_EXECUTABLE_NAME: 'Void Presence'

      - name: Build Application (Mac & Linux)
        if: matrix.platform != 'windows'
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_EXECUTABLE_NAME: 'voidpresence'

      - name: Debug artifacts before rename (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          echo "=== out/make BEFORE rename (macOS) ==="
          find out/make -type f | sort || true

      - name: Debug artifacts before rename (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          echo "=== out/make BEFORE rename (Linux) ==="
          find out/make -type f | sort || true

      - name: Rename NSIS installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem out\make\nsis\x64\*.exe | ForEach-Object {
            $newName = $_.Name -replace " ", "."
            Rename-Item $_.FullName -NewName $newName
          }

      - name: Rename ZIP (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v',''
          $file = Get-ChildItem out\make\zip\win32\x64\*.zip | Select-Object -First 1
          $newName = "Void.Presence.Portable.$version.zip"
          Rename-Item $file.FullName -NewName $newName

      - name: Rename macOS artifacts
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"

          dmg_dir="out/make/dmg/arm64"
          zip_arm_dir="out/make/zip/darwin/arm64"
          zip_x64_dir="out/make/zip/darwin/x64"

          if [ -f "out/make/Void Presence.dmg" ] || [ -f "out/make/voidpresence.dmg" ]; then
            mkdir -p "$dmg_dir"
            mv out/make/*.dmg "$dmg_dir/" 2>/dev/null || true
          fi

          for f in "$dmg_dir"/*.dmg; do
            [ -f "$f" ] || continue
            mv "$f" "$dmg_dir/Void.Presence.$version.dmg"
            break
          done

          for f in "$zip_x64_dir"/*.zip; do
            [ -f "$f" ] || continue
            mv "$f" "$zip_x64_dir/Void.Presence.Portable.$version.x64.zip"
            break
          done

          for f in "$zip_arm_dir"/*.zip; do
            [ -f "$f" ] || continue
            mv "$f" "$zip_arm_dir/Void.Presence.Portable.$version.arm64.zip"
            break
          done

      - name: Rename Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"

          deb_dir="out/make/deb/x64"
          rpm_dir="out/make/rpm/x64"
          zip_dir="out/make/zip/linux/x64"

          for f in "$deb_dir"/*.deb; do
            [ -f "$f" ] || continue
            mv "$f" "$deb_dir/Void.Presence.$version.amd64.deb"
            break
          done

          for f in "$rpm_dir"/*.rpm; do
            [ -f "$f" ] || continue
            mv "$f" "$rpm_dir/Void.Presence.$version.x86_64.rpm"
            break
          done

          for f in "$zip_dir"/*.zip; do
            [ -f "$f" ] || continue
            mv "$f" "$zip_dir/Void.Presence.Portable.$version.linux.zip"
            break
          done

      - name: List build output
        shell: bash
        run: |
          echo "=== out/make AFTER rename ==="
          find out/make -type f | sort || true

      - name: Upload build artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            out/make/nsis/x64/Void.Presence.Setup.*.exe
            out/make/zip/win32/x64/Void.Presence.Portable.*.zip
          retention-days: 1

      - name: Upload build artifacts (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            out/make/dmg/arm64/Void.Presence.*.dmg
            out/make/zip/darwin/x64/Void.Presence.Portable.*.x64.zip
            out/make/zip/darwin/arm64/Void.Presence.Portable.*.arm64.zip
          retention-days: 1

      - name: Upload build artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            out/make/deb/x64/Void.Presence.*.amd64.deb
            out/make/rpm/x64/Void.Presence.*.x86_64.rpm
            out/make/zip/linux/x64/Void.Presence.Portable.*.linux.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show collected artifacts
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete unwanted auto-generated assets
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[].name' \
          | grep -E '^Void-Presence-Setup-.*\.exe$|^Void-Presence-Setup-.*\.exe\.blockmap$|^latest\.yml$' \
          | while read -r ASSET; do
              gh release delete-asset "$TAG" "$ASSET" -y || true
            done || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger void-updates repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UPDATER_TOKEN }}
          repository: Devollox/void-updates
          event-type: main_repo_updated
          client-payload: '{"tag": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}'

      - name: Update release description from RELEASE_NOTES.md
        run: |
          gh release edit ${{ github.ref_name }} --notes-file RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
