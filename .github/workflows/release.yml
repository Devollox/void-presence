name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if release already exists for this tag
        id: check
        run: |
          if gh release view "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: preflight
    if: needs.preflight.outputs.exists == 'false'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            rpm \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libxcb-dri3-0

      - name: Install dependencies
        run: npm install

      - name: Build Application
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename NSIS installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem out\make\nsis\x64\*.exe | ForEach-Object {
            $newName = $_.Name -replace " ", "."
            Rename-Item $_.FullName -NewName $newName
          }

      - name: Rename ZIP (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v',''
          $file = Get-ChildItem out\make\zip\win32\x64\*.zip | Select-Object -First 1
          $newName = "Void.Presence.Portable.$version.zip"
          Rename-Item $file.FullName -NewName $newName

      - name: Rename macOS artifacts
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          for f in out/make/*.dmg; do
            [ -f "$f" ] && mv "$f" "Void.Presence.$version.dmg" && break
          done
          for f in out/make/zip/darwin/x64/*.zip; do
            [ -f "$f" ] && mv "$f" "Void.Presence.Portable.$version.x64.zip"
          done
          for f in out/make/zip/darwin/arm64/*.zip; do
            [ -f "$f" ] && mv "$f" "Void.Presence.Portable.$version.arm64.zip"
          done

      - name: Rename Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          for f in out/make/deb/x64/*.deb; do
            [ -f "$f" ] && mv "$f" "Void.Presence.$version.amd64.deb" && break
          done
          for f in out/make/rpm/x64/*.rpm; do
            [ -f "$f" ] && mv "$f" "Void.Presence.$version.x86_64.rpm" && break
          done
          for f in out/make/zip/linux/x64/*.zip; do
            [ -f "$f" ] && mv "$f" "Void.Presence.Portable.$version.linux.zip" && break
          done

      - name: List build output
        shell: bash
        run: |
          echo "=== out/make tree ==="
          find out/make -type f | sort || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            out/make/nsis/x64/Void.Presence.Setup.*.exe
            out/make/zip/win32/x64/Void.Presence.Portable.*.zip
            out/make/Void.Presence.*.dmg
            out/make/zip/darwin/x64/Void.Presence.Portable.*.x64.zip
            out/make/zip/darwin/arm64/Void.Presence.Portable.*.arm64.zip
            out/make/Void.Presence.*.amd64.deb
            out/make/Void.Presence.*.x86_64.rpm
            out/make/zip/linux/x64/Void.Presence.Portable.*.linux.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show collected artifacts
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete unwanted auto-generated assets
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[].name' \
          | grep -E '^Void-Presence-Setup-.*\.exe$|^Void-Presence-Setup-.*\.exe\.blockmap$|^latest\.yml$' \
          | while read -r ASSET; do
              gh release delete-asset "$TAG" "$ASSET" -y || true
            done || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger void-updates repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UPDATER_TOKEN }}
          repository: Devollox/void-updates
          event-type: main_repo_updated
          client-payload: '{"tag": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}'
