name: Build and Pre-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: npm install

      - name: Build application
        if: steps.check_release.outputs.exists == 'false'
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup assets
        if: steps.check_release.outputs.exists == 'false'
        shell: bash
        run: |
          find out/make -type f \( -name "*.blockmap" -o -name "*.yml" \) -delete
          ls -R out/make

      - name: Rename NSIS installer
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          Get-ChildItem out\make\nsis\x64\*.exe | ForEach-Object {
            $newName = $_.Name -replace " ", "."
            Rename-Item $_.FullName -NewName $newName
          }

      - name: Rename ZIP
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v',''
          $file = Get-ChildItem out\make\zip\win32\x64\*.zip | Select-Object -First 1
          $newName = "Void.Presence.Portable.$version.zip"
          Rename-Item $file.FullName -NewName $newName

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/make/nsis/x64/*.exe
            out/make/zip/win32/x64/*.zip
          body_path: RELEASE_NOTES.md
          tag_name: ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release description from RELEASE_NOTES.md
        if: steps.check_release.outputs.exists == 'false'
        run: |
          gh release edit ${{ github.ref_name }} --notes-file RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete unwanted assets
        if: steps.check_release.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[].name' \
          | grep -E '^Void-Presence-Setup-.*\.exe$|^Void-Presence-Setup-.*\.exe\.blockmap$|^latest\.yml$' \
          | while read -r ASSET; do
              gh release delete-asset "$TAG" "$ASSET" -y
            done || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger void-updates repo
        if: steps.check_release.outputs.exists == 'false'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UPDATER_TOKEN }}
          repository: Devollox/void-updates
          event-type: main_repo_updated
          client-payload: '{"tag": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}'
