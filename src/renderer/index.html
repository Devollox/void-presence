<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Void Presence</title>
		<link rel="icon" type="image/png" href="../../public/favicons/logo.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./styles/styles.css" />
		<link rel="stylesheet" href="./styles/titlebar.css" />
		<link rel="stylesheet" href="./styles/tabs.css" />
		<link rel="stylesheet" href="./styles/app-content.css" />
		<link rel="stylesheet" href="./styles/sidebar.css" />
	</head>
	<body>
		<div class="app">
			<div class="titlebar">
				<div class="titlebar-buttons">
					<button type="button" id="window-minimize" class="titlebar-btn" aria-label="Minimize">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="lucide lucide-minus preview-icon"
							aria-hidden="true"
						>
							<path d="M5 12h14" />
						</svg>
					</button>
					<button type="button" id="window-maximize" class="titlebar-btn" aria-label="Maximize">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="lucide lucide-square-arrow-down-left-exit preview-icon"
						>
							<path d="M13 21h6a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6" />
							<path d="m3 21 9-9" />
							<path d="M9 21H3v-6" />
						</svg>
					</button>
					<button type="button" id="window-close" class="titlebar-btn" aria-label="Close">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="lucide lucide-x preview-icon"
							aria-hidden="true"
						>
							<path d="M18 6 6 18" />
							<path d="m6 6 12 12" />
						</svg>
					</button>
				</div>
			</div>

			<header class="desktop-tabs-bar">
				<div class="nav-controls">
					<button
						type="button"
						class="nav-icon-btn sidebar-toggle-btn"
						aria-label="Toggle sidebar"
						aria-controls="app-sidebar"
						aria-expanded="true"
						data-tooltip="Toggle sidebar"
						data-shortcut="["
					>
						<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
							<path
								fill-rule="evenodd"
								clip-rule="evenodd"
								d="M4.25 2C2.45508 2 1 3.45508 1 5.25V10.75C1 12.5449 2.45508 14 4.25 14H11.75C13.5449 14 15 12.5449 15 10.75V5.25C15 3.45508 13.5449 2 11.75 2H4.25ZM2.5 5.5C2.5 4.39543 3.39543 3.5 4.5 3.5H11.5C12.6046 3.5 13.5 4.39543 13.5 5.5V10.5C13.5 11.6046 12.6046 12.5 11.5 12.5H4.5C3.39543 12.5 2.5 11.6046 2.5 10.5V5.5Z"
							/>
							<rect class="sidebar-icon-panel" x="3.5" y="4.5" width="2.5" height="7" rx="0.75" />
						</svg>
					</button>

					<div
						id="connection-status"
						class="nav-status-indicator"
						data-status="online"
						data-tooltip="Online"
						aria-label="Online"
					>
						<div class="status-dot"></div>
					</div>

					<button
						type="button"
						id="nav-back"
						class="nav-icon-btn"
						aria-label="Go back"
						data-tooltip="Go back"
						data-shortcut="Alt+←"
						disabled
					>
						<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
							<path
								d="M10.53033 11.4697C10.82322 11.7626 10.82322 12.2374 10.53033 12.5303C10.23744 12.8232 9.76256 12.8232 9.46967 12.5303L5.46967 8.53033C5.1793 8.23999 5.1764 7.77014 5.4632 7.47624L9.36581 3.47624C9.65508 3.17976 10.12991 3.17391 10.42639 3.46318C10.72287 3.75244 10.72872 4.22728 10.43946 4.52376L7.05417 7.99351L10.53033 11.4697Z"
							/>
						</svg>
					</button>

					<button
						type="button"
						id="nav-forward"
						class="nav-icon-btn"
						aria-label="Go forward"
						data-tooltip="Go forward"
						data-shortcut="Alt+→"
						disabled
					>
						<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
							<path
								d="M5.46967 11.4697C5.17678 11.7626 5.17678 12.2374 5.46967 12.5303C5.76256 12.8232 6.23744 12.8232 6.53033 12.5303L10.5303 8.53033C10.8207 8.23999 10.8236 7.77014 10.5368 7.47624L6.63419 3.47624C6.34492 3.17976 5.87009 3.17391 5.57361 3.46318C5.27713 3.75244 5.27128 4.22728 5.56054 4.52376L8.94583 7.99351L5.46967 11.4697Z"
							/>
						</svg>
					</button>
				</div>

				<div class="tabs-area">
					<div class="tabs tabs-scroll-container" data-horizontal-scroll-container="true">
						<button
							type="button"
							id="nav-main"
							class="tab-btn desktop-tab"
							data-page="presence"
							data-desktop-tab="true"
							data-active="true"
							data-tooltip="Presence"
							data-shortcut="Ctrl+1"
						>
							<span class="desktop-tab-content">
								<span class="desktop-tab-icon" aria-hidden="true">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="14"
										height="14"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="1"
										stroke-linecap="round"
										stroke-linejoin="round"
										class="lucide lucide-square-round-corner preview-icon"
									>
										<path d="M21 11a8 8 0 0 0-8-8" />
										<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
									</svg>
								</span>
								<span class="desktop-tab-title" data-i18n="tabs.presence">Presence</span>
							</span>
						</button>

						<button
							type="button"
							id="nav-status"
							class="tab-btn desktop-tab"
							data-page="status"
							data-desktop-tab="true"
							data-active="false"
							data-tooltip="Status"
							data-shortcut="Ctrl+2"
						>
							<span class="desktop-tab-content">
								<span class="desktop-tab-icon" aria-hidden="true">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="14"
										height="14"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="1"
										stroke-linecap="round"
										stroke-linejoin="round"
										class="lucide lucide-square-activity preview-icon"
									>
										<rect width="18" height="18" x="3" y="3" rx="2" />
										<path d="M17 12h-2l-2 5-2-10-2 5H7" />
									</svg>
								</span>
								<span class="desktop-tab-title" data-i18n="tabs.status">Status</span>
							</span>
						</button>

						<button
							type="button"
							id="nav-logs"
							class="tab-btn desktop-tab"
							data-page="logs"
							data-desktop-tab="true"
							data-active="false"
							data-tooltip="Logs"
							data-shortcut="Ctrl+3"
						>
							<span class="desktop-tab-content">
								<span class="desktop-tab-icon" aria-hidden="true">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="14"
										height="14"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="1"
										stroke-linecap="round"
										stroke-linejoin="round"
										class="lucide lucide-logs preview-icon"
									>
										<path d="M3 5h1" />
										<path d="M3 12h1" />
										<path d="M3 19h1" />
										<path d="M8 5h1" />
										<path d="M8 12h1" />
										<path d="M8 19h1" />
										<path d="M13 5h8" />
										<path d="M13 12h8" />
										<path d="M13 19h8" />
									</svg>
								</span>
								<span class="desktop-tab-title" data-i18n="tabs.logs">Logs</span>
							</span>
						</button>

						<button
							type="button"
							id="nav-plugins"
							class="tab-btn desktop-tab"
							data-page="plugins"
							data-desktop-tab="true"
							data-active="false"
							data-tooltip="Plugins"
							data-shortcut="Ctrl+4"
						>
							<span class="desktop-tab-content">
								<span class="desktop-tab-icon" aria-hidden="true">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="14"
										height="14"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="1"
										stroke-linecap="round"
										stroke-linejoin="round"
										class="lucide lucide-puzzle preview-icon"
									>
										<path
											d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"
										/>
									</svg>
								</span>
								<span class="desktop-tab-title" data-i18n="tabs.plugins">Plugins</span>
							</span>
						</button>

						<button
							type="button"
							id="nav-config"
							class="tab-btn desktop-tab"
							data-page="config"
							data-desktop-tab="true"
							data-active="false"
							data-tooltip="Configs"
							data-shortcut="Ctrl+5"
						>
							<span class="desktop-tab-content">
								<span class="desktop-tab-icon" aria-hidden="true">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="14"
										height="14"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="1"
										stroke-linecap="round"
										stroke-linejoin="round"
										class="lucide lucide-sliders-horizontal preview-icon"
									>
										<path d="M10 5H3" />
										<path d="M12 19H3" />
										<path d="M14 3v4" />
										<path d="M16 17v4" />
										<path d="M21 12h-9" />
										<path d="M21 19h-5" />
										<path d="M21 5h-7" />
										<path d="M8 10v4" />
										<path d="M8 12H3" />
									</svg>
								</span>
								<span class="desktop-tab-title" data-i18n="tabs.config">Configs</span>
							</span>
						</button>

						<button
							type="button"
							id="nav-settings"
							class="tab-btn desktop-tab"
							data-page="settings"
							data-desktop-tab="true"
							data-active="false"
							data-tooltip="Settings"
							data-shortcut="Ctrl+6"
						>
							<span class="desktop-tab-content">
								<span class="desktop-tab-icon" aria-hidden="true">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="14"
										height="14"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="1"
										stroke-linecap="round"
										stroke-linejoin="round"
										class="lucide lucide-settings preview-icon"
									>
										<path
											d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
										/>
										<circle cx="12" cy="12" r="3" />
									</svg>
								</span>
								<span class="desktop-tab-title" data-i18n="tabs.settings">Settings</span>
							</span>
						</button>
					</div>
				</div>
			</header>

			<div class="app-workspace">
				<aside id="app-sidebar" class="app-sidebar" data-open="true">
					<div class="sidebar-content"></div>
				</aside>

				<main class="app-content">
					<section data-view="presence" data-active="true">Presence page</section>
					<section data-view="status" data-active="false">Status page</section>
					<section data-view="logs" data-active="false">Logs page</section>
					<section data-view="plugins" data-active="false">Plugins page</section>
					<section data-view="config" data-active="false">Configs page</section>
					<section data-view="settings" data-active="false">Settings page</section>
				</main>
			</div>
		</div>

		<div id="blocks-toast" class="copy-toast" data-visible="false"></div>

		<div id="global-drop-overlay" data-active="false"></div>

		<script type="module" src="../../build/renderer/renderer.js"></script>
	</body>
</html>
